name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Observe Unicode move filesystem
        shell: bash
        run: |
          uname -a
          printf 'runner OS=%s image=%s version=%s temp=%s\n' "$RUNNER_OS" "$ImageOS" "$ImageVersion" "$RUNNER_TEMP"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            findmnt -T "${TMPDIR:-/tmp}" -o TARGET,SOURCE,FSTYPE,OPTIONS
          else
            df -T "${TMPDIR:-/tmp}"
          fi
      - name: Unicode move regressions
        run: go test -count=1 -v ./internal/core -run '^TestMoveNFD'
      - name: All tests
        if: always()
        run: go test ./...
